# Deploys this repo to Vercel on every push to main.
#
# WHY THIS EXISTS: an agent sandbox often cannot reach vercel.com directly.
# This workflow runs on GitHub's runners instead, so the deploy happens from
# a network that CAN reach Vercel — and the token never touches the sandbox.
#
# ONE-TIME SETUP (see SETUP.md):
#   1. Create a Vercel token:  https://vercel.com/account/settings/tokens
#   2. Add it as a GitHub secret named VERCEL_TOKEN
#      (org-wide secret = every future repo inherits it automatically)
#
# After that, `git push` is the only thing needed to deploy. Forever.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Optional: only needed if deploying into a Team rather than a personal account.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. See SETUP.md."
            exit 1
          fi
          # --yes accepts defaults, which CREATES the project on first run
          # using the repo name. No manual import step in the Vercel dashboard.
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed"
            echo ""
            echo "**$URL**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to $URL"

      - name: Smoke-test the deployment
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 --retry-all-errors "$URL")
          echo "HTTP $CODE from $URL"
          [ "$CODE" = "200" ] || { echo "::error::Deployment returned HTTP $CODE"; exit 1; }
